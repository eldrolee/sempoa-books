<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {

          surface: 'rgb(var(--surface) / <alpha-value>)',

          ink: 'rgb(var(--ink) / <alpha-value>)',

        }
      }
    }
  };

<style>
  /* Layout: fixed ledger sidebar on desktop, sticky header + scrolling tab strip on phones.
     Slate neutrals with a slight blue bias; emerald = money in, rose = money out. */
  :root {
    --bg: 243 245 248; --surface: 255 255 255; --sunken: 236 239 244; --line: 221 226 234;
    --ink: 16 23 38; --muted: 94 107 128;
    --primary: 16 23 38; --onprimary: 255 255 255;
    --pos: 4 130 93; --onpos: 255 255 255; --neg: 205 35 74; --warn: 176 96 6; --info: 37 99 235;
    --paper: 255 255 255; --paperink: 24 28 36;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: 11 14 19; --surface: 19 23 30; --sunken: 27 32 41; --line: 41 48 60;
      --ink: 228 232 239; --muted: 145 156 175;
      --primary: 228 232 239; --onprimary: 14 17 23;
      --pos: 52 211 153; --onpos: 4 30 21; --neg: 251 113 133; --warn: 251 191 36; --info: 96 165 250;
      --paper: 252 252 250; --paperink: 24 28 36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: 11 14 19; --surface: 19 23 30; --sunken: 27 32 41; --line: 41 48 60;
    --ink: 228 232 239; --muted: 145 156 175;
    --primary: 228 232 239; --onprimary: 14 17 23;
    --pos: 52 211 153; --onpos: 4 30 21; --neg: 251 113 133; --warn: 251 191 36; --info: 96 165 250;
    --paper: 252 252 250; --paperink: 24 28 36;
    color-scheme: dark;
  }
  html, body { background: rgb(var(--bg)); color: rgb(var(--ink)); }
  body { font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: rgb(var(--bg)); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: rgb(var(--muted)); }
  h1, h2, h3 { text-wrap: balance; }
  .sticky-top { top: env(safe-area-inset-top, 0px); }
  .fab { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .toast-pos { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .modal-wrap { padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  @media (min-width: 640px) { .modal-wrap { padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); } }
  .modal-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .modal-foot { padding-bottom: 12px; } }
  .noscroll::-webkit-scrollbar { display: none; } .noscroll { scrollbar-width: none; }
  :focus-visible { outline: 2px solid rgb(var(--info)); outline-offset: 2px; border-radius: 6px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  @keyframes laser { 0% { top: 3%; } 50% { top: 95%; } 100% { top: 3%; } }
  .laser { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, rgb(var(--pos)), transparent); box-shadow: 0 0 16px 4px rgb(var(--pos) / .45); animation: laser 1.7s ease-in-out infinite; }
  .scanveil { background: repeating-linear-gradient(0deg, rgb(var(--pos) / .05) 0 2px, transparent 2px 6px); }
  @keyframes pulsebox { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .pulse-box { animation: pulsebox 1.2s ease-in-out infinite; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .rise { animation: rise .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .laser, .pulse-box, .rise { animation: none; } .laser { top: 50%; } }
  .paper-shadow { box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 32px -12px rgb(0 0 0 / .25); }
  .crop-h { position: absolute; width: 16px; height: 16px; border-color: rgb(var(--pos)); border-style: solid; }
  select { background-image: none; }
@media print { body * { visibility: hidden !important; } .print-area, .print-area * { visibility: visible !important; } .print-area { position: absolute; left: 0; top: 0; width: 100%; max-width: none !important; box-shadow: none !important; } }
</style>
