<style>
  /* Sempoa = the abacus. Batik-indigo rail, brass beads, cool porcelain paper.
     Emerald = money in, rose = money out; brass marks the thing to look at. */
  :root {
    --bg: 241 242 247; --surface: 255 255 255; --sunken: 234 236 244; --line: 222 225 236;
    --ink: 22 27 51; --muted: 98 104 132;
    --primary: 30 42 90; --onprimary: 255 255 255;
    --accent: 201 150 47; --onaccent: 33 24 4;
    --rail: 27 36 79; --onrail: 236 238 248; --railmuted: 160 168 205; --railhi: 41 52 104;
    --pos: 13 122 85; --onpos: 255 255 255; --neg: 194 51 77; --warn: 168 98 8; --info: 52 88 214;
    --paper: 255 255 255; --paperink: 24 28 36;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: 14 17 33; --surface: 22 26 47; --sunken: 30 35 61; --line: 44 50 82;
      --ink: 231 233 245; --muted: 150 156 189;
      --primary: 214 172 84; --onprimary: 28 20 4;
      --accent: 214 172 84; --onaccent: 28 20 4;
      --rail: 18 22 44; --onrail: 231 233 245; --railmuted: 138 146 186; --railhi: 33 39 72;
      --pos: 64 201 150; --onpos: 4 30 21; --neg: 245 118 140; --warn: 240 184 66; --info: 128 160 255;
      --paper: 252 252 250; --paperink: 24 28 36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: 14 17 33; --surface: 22 26 47; --sunken: 30 35 61; --line: 44 50 82;
    --ink: 231 233 245; --muted: 150 156 189;
    --primary: 214 172 84; --onprimary: 28 20 4;
    --accent: 214 172 84; --onaccent: 28 20 4;
    --rail: 18 22 44; --onrail: 231 233 245; --railmuted: 138 146 186; --railhi: 33 39 72;
    --pos: 64 201 150; --onpos: 4 30 21; --neg: 245 118 140; --warn: 240 184 66; --info: 128 160 255;
    --paper: 252 252 250; --paperink: 24 28 36;
    color-scheme: dark;
  }
  html, body { background: rgb(var(--bg)); color: rgb(var(--ink)); }
  body { font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: rgb(var(--bg)); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1; letter-spacing: 0; }
  .figure { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1; font-variation-settings: "opsz" 64; letter-spacing: -0.02em; }
  .display { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; font-variation-settings: "opsz" 48; letter-spacing: -0.015em; }
  .eyebrow { font-size: 12px; letter-spacing: 0; font-weight: 600; color: rgb(var(--muted)); }
  .bead { display: inline-block; width: var(--bd, 14px); height: calc(var(--bd, 14px) * .78); border-radius: 50%; position: relative; }
  .bead::after { content: ""; position: absolute; inset: 18% 22% auto; height: 26%; border-radius: 50%; background: rgb(255 255 255 / .35); }
  .rod { position: relative; } .rod::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; border-radius: 2px; background: rgb(var(--line)); }
  @keyframes beadin { from { transform: translateX(var(--from, -40px)); opacity: 0; } to { transform: none; opacity: 1; } }
  .bead-in { animation: beadin .7s cubic-bezier(.2,.8,.2,1) both; }
  .rail-scroll::-webkit-scrollbar { width: 6px; } .rail-scroll::-webkit-scrollbar-thumb { background: rgb(var(--railhi)); border-radius: 6px; }
  h1, h2, h3 { text-wrap: balance; }
  .sticky-top { top: env(safe-area-inset-top, 0px); }
  .fab { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .toast-pos { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .modal-wrap { padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  @media (min-width: 640px) { .modal-wrap { padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); } }
  .modal-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .modal-foot { padding-bottom: 12px; } }
  .noscroll::-webkit-scrollbar { display: none; } .noscroll { scrollbar-width: none; }
  :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 6px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  @keyframes laser { 0% { top: 3%; } 50% { top: 95%; } 100% { top: 3%; } }
  .laser { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, rgb(var(--pos)), transparent); box-shadow: 0 0 16px 4px rgb(var(--pos) / .45); animation: laser 1.7s ease-in-out infinite; }
  .scanveil { background: repeating-linear-gradient(0deg, rgb(var(--pos) / .05) 0 2px, transparent 2px 6px); }
  @keyframes pulsebox { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .pulse-box { animation: pulsebox 1.2s ease-in-out infinite; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .rise { animation: rise .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .laser, .pulse-box, .rise, .bead-in { animation: none; } .laser { top: 50%; } }
  .paper-shadow { box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 32px -12px rgb(0 0 0 / .25); }
  .crop-h { position: absolute; width: 16px; height: 16px; border-color: rgb(var(--pos)); border-style: solid; }
  select { background-image: none; }
@media print { body * { visibility: hidden !important; } .print-area, .print-area * { visibility: visible !important; } .print-area { position: absolute; left: 0; top: 0; width: 100%; max-width: none !important; box-shadow: none !important; } }
</style>
